# ═════════════════════════════════════════════════════════════
# CI/CD Pipeline — PSRMENUDIGITAL (Laravel Backend + React/Vite Frontend)
# Unit (Jest + coverage 100% lib) → E2E Laravel Real-API (Playwright)
# Backend = Laravel 11 (PHP + composer). Frontend = Vite + React.
# NO Supabase — semua data lewat VITE_API_URL (Laravel proxy).
# ═════════════════════════════════════════════════════════════
name: "🚀 CI — PSRMENUDIGITAL (Laravel + Vite)"

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

env:
  NODE_ENV: "test"
  VITE_API_URL: "http://localhost:8080"
  VITE_USE_MOCKS: "false"

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Unit + Integration + Coverage 100% (src/lib)
  # ─────────────────────────────────────────────────────
  unit-coverage:
    name: "🧪 Unit & Coverage 100%"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: "📥 Install dependencies"
        run: npm ci

      - name: "🧪 Run Jest with coverage (threshold 100% src/lib)"
        run: npm run test:coverage -- --ci --passWithNoTests --forceExit
        env:
          CI: true

      - name: "📊 Upload Jest coverage"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jest-coverage
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────
  # JOB 2: E2E Laravel Real-API (Playwright)
  # ─────────────────────────────────────────────────────
  e2e-laravel:
    name: "🎭 E2E Laravel Real-API"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-coverage
    steps:
      - name: "🔄 Checkout"
        uses: actions/checkout@v4

      - name: "📦 Setup Node.js LTS"
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: "🐘 Setup PHP 8.2 + composer + pdo_sqlite"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: "mbstring, pdo_sqlite"
          tools: "composer:v2"
          coverage: "none"

      - name: "📥 Install frontend deps"
        run: npm ci

      - name: "📥 Composer install (backend)"
        working-directory: backend
        run: composer install --no-interaction --no-security-blocking

      - name: "📋 Copy Laravel env example to backend"
        run: cp backend/.env.example backend/.env

      - name: "🗄️ Setup SQLite + migrate + seed"
        working-directory: backend
        run: |
          touch database/database.sqlite
          php artisan key:generate || true
          php artisan migrate --seed --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: "🚀 Start Laravel backend (port 8080)"
        working-directory: backend
        run: php artisan serve --port=8080 &
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: "🏗️ Build frontend"
        run: npm run build

      - name: "🎭 Install Playwright chromium"
        run: npx playwright install --with-deps chromium

      - name: "🚀 Start Vite preview (port 5173)"
        run: npx vite preview --port 5173 &
        env:
          VITE_API_URL: "http://localhost:8080"
          VITE_USE_MOCKS: "false"

      - name: "🎭 Run Playwright E2E (Laravel real-api)"
        run: npx playwright test e2e/laravel-smoke.spec.ts
        env:
          CI: true
          VITE_API_URL: "http://localhost:8080"
          VITE_USE_MOCKS: "false"

      - name: "📊 Upload Playwright report"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────
  # JOB 3: CI Summary
  # ─────────────────────────────────────────────────────
  ci-summary:
    name: "✅ CI Summary"
    runs-on: ubuntu-latest
    needs: [unit-coverage, e2e-laravel]
    if: always()
    steps:
      - name: "📋 Report status"
        run: |
          echo "╔══════════════════════════════════╗"
          echo "║  CI — PSRMENUDIGITAL             ║"
          echo "╠══════════════════════════════════╣"
          echo "║  Unit + Coverage : ${{ needs.unit-coverage.result }}"
          echo "║  E2E Laravel     : ${{ needs.e2e-laravel.result }}"
          echo "╚══════════════════════════════════╝"
      - name: "❌ Fail if any job failed"
        if: >-
          needs.unit-coverage.result == 'failure' ||
          needs.e2e-laravel.result == 'failure'
        run: |
          echo "One or more jobs failed."
          exit 1
